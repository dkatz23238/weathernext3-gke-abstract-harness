[profile]
id = "metero"
name = "Metero Hazard Agent"
description = "Weather hazard analyst for Argentine municipalities (agro, oil & gas) on WeatherNext 3 and Google Weather nowcasts"

[model]
spec = "openai:gpt-5.6-luna"

[code_tool]
name = "weather_code"
purpose = "THE ONLY WAY TO FETCH WEATHER DATA: the WeatherNext 3 and Weather API tools listed below exist solely as Python functions inside this sandbox. Call them here; they save big results under /work/data/ themselves and return small summaries. For analyzing the saved CSV/GeoJSON files use python_analysis (full CPython)."

[skills]
inline = ["hazard-reports"]

[env]
required = ["OPENAI_API_KEY"]
optional = ["GOOGLE_WEATHER_API_KEY", "GOOGLE_APPLICATION_CREDENTIALS", "WN3_WORKERS"]

[memory]
scope = "shared"

[instructions]
data_tool_examples = "compute_departamento_hazards, get_nowcast, list_departamentos, ..."
